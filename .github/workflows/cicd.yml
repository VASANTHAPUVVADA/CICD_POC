name: Hello World CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hello-world-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: hello-world
  CONTAINER_NAME: hello-world

jobs:
  validate:
    name: Validate application and Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Build Docker image
        run: docker build --tag hello-world:${{ github.sha }} .

  publish:
    name: Push image to Amazon ECR
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          image_uri="$ECR_REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA}"
          latest_uri="$ECR_REGISTRY/${ECR_REPOSITORY}:latest"
          docker build --tag "$image_uri" --tag "$latest_uri" .
          docker push "$image_uri"
          docker push "$latest_uri"
          echo "uri=$image_uri" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to self-hosted instance
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish
    runs-on: self-hosted
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Replace running container
        env:
          IMAGE_URI: ${{ needs.publish.outputs.image }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
        run: |
          set -eu
          docker pull "$IMAGE_URI"
          docker rm --force "$CONTAINER_NAME" 2>/dev/null || true
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --publish 80:3000 \
            "$IMAGE_URI"
